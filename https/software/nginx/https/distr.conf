# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name device4autism.in;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name device4autism.in;

    # SSL Certs
    ssl_certificate /etc/ssl/n8n/fullchain.pem;
    ssl_certificate_key /etc/ssl/n8n/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Correct React build folder
    root /var/www/distr/build/dist;
    index index.html;

    # Serve assets folder
   # location /assets/ {
    #    try_files $uri $uri/ =404;
     #   expires 30d;
      #  add_header Cache-Control "public, max-age=2592000";
    #}

    # Proxy API calls to Spring Boot backend
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://localhost:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # React Router SPA fallback
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;
    gzip_min_length 256;
}
