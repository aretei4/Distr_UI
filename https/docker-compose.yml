version: '3'

services:

 nginx:
    image: nginx:alpine
    container_name: n8n-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/n8n.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/fullchain.pem:/etc/ssl/n8n/fullchain.pem
      - ./ssl/privkey.pem:/etc/ssl/n8n/privkey.pem
      - /home/ubuntu/dist:/var/www/distr/build/dist
