server {
    listen 80;
    server_name device4autism.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name device4autism.in;

    ssl_certificate /etc/ssl/n8n/fullchain.pem;
    ssl_certificate_key /etc/ssl/n8n/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # React build root
    root /var/www/distr/build/dist;
    index index.html;

    # Prevent redirect loop (no service worker)
    location = /sw.js {
     add_header Cache-Control "no-store";   
     return 404;
    }
    # Stop redirect loop for index.html
    location = /index.html {
        try_files /index.html =404;
    }

    # Serve JavaScript, CSS, images from /assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy backend API to Spring Boot
    location /api/ {
        proxy_pass http://52.66.119.34:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router support — fallback to index.html
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;
}
