server {
    listen 80;
    server_name trialc5.qualcy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name trialc5.qualcy.net;

    ssl_certificate /etc/ssl/qualcy/fullchain.pem;
    ssl_certificate_key /etc/ssl/qualcy/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Fix for images, CSS, JS, fonts, etc.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        proxy_pass http://13.204.49.246:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 30d;
    }
	
    location / {
        proxy_pass http://13.204.49.246:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 5678 ssl http2;
	 listen [::]:5678 ssl http2;
    server_name trialc5.qualcy.net;

    ssl_certificate /etc/ssl/qualcy/fullchain.pem;
